name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/*.dvc'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

# Khong cho hai pipeline cung promote model production mot luc.
concurrency:
  group: income-model-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"
  GCP_PROJECT_ID: track2-day16-01104

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Pull DVC data, train, log MLflow to DagsHub, then upload an immutable
  # candidate. Production is not overwritten in this job.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
      previous_f1: ${{ steps.previous_report.outputs.previous_f1 }}
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Pull training data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Read current production report
        id: previous_report
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import json
          import os
          from google.cloud import storage

          blob = storage.Client().bucket(os.environ["ARTIFACT_BUCKET"]).blob(
              "artifacts/current/report.json"
          )
          previous_f1 = ""
          if blob.exists():
              report = json.loads(blob.download_as_text())
              value = float(report["f1_score"])
              if not 0.0 <= value <= 1.0:
                  raise ValueError(f"Invalid production f1_score: {value}")
              previous_f1 = str(value)
              print(f"Current production F1: {value:.4f}")
          else:
              print("No production report found; this is the first deployment.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"previous_f1={previous_f1}", file=output)
          PYEOF

      - name: Check training data distribution
        run: |
          python - <<'PYEOF'
          import pandas as pd
          from src.train import DRIFT_TOLERANCE, REFERENCE_POSITIVE_RATIO

          ratio = float(pd.read_csv("data/train_batch1.csv")["target"].mean())
          shift = abs(ratio - REFERENCE_POSITIVE_RATIO)
          if shift > DRIFT_TOLERANCE:
              print(
                  f"WARNING: positive ratio {ratio:.1%} differs by {shift:.1%} "
                  f"from reference {REFERENCE_POSITIVE_RATIO:.1%}."
              )
          else:
              print(
                  f"PASSED: positive ratio {ratio:.1%}; "
                  f"reference {REFERENCE_POSITIVE_RATIO:.1%}."
              )
          PYEOF

      - name: Train model and log to DagsHub MLflow
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          python - <<'PYEOF'
          import json
          import os

          with open("outputs/report.json", encoding="utf-8") as report_file:
              report = json.load(report_file)
          f1 = float(report["f1_score"])
          if not 0.0 <= f1 <= 1.0:
              raise ValueError(f"Invalid f1_score: {f1}")
          print(f"New candidate F1: {f1:.4f}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"f1={f1}", file=output)
          PYEOF

      - name: Upload candidate to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ["ARTIFACT_BUCKET"]
          prefix = f"artifacts/candidates/{os.environ['GITHUB_SHA']}"
          files = {
              "models/model.joblib": f"{prefix}/model.joblib",
              "outputs/report.json": f"{prefix}/report.json",
              "outputs/detail.txt": f"{prefix}/detail.txt",
          }
          bucket = storage.Client().bucket(bucket_name)
          for local_path, object_name in files.items():
              if not os.path.isfile(local_path):
                  raise FileNotFoundError(local_path)
              bucket.blob(object_name).upload_from_filename(local_path)
              print(f"Uploaded gs://{bucket_name}/{object_name}")
          PYEOF

      - name: Save evaluation reports as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-reports-${{ github.sha }}
          path: |
            outputs/report.json
            outputs/detail.txt
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Require f1 >= 0.65 and never deploy a candidate worse than production.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    env:
      NEW_F1: ${{ needs.train.outputs.f1 }}
      PREVIOUS_F1: ${{ needs.train.outputs.previous_f1 }}
    steps:
      - name: Check absolute and production quality gates
        run: |
          python - <<'PYEOF'
          import os

          new_f1 = float(os.environ["NEW_F1"])
          if new_f1 < 0.65:
              raise SystemExit(
                  f"FAILED: candidate F1 {new_f1:.4f} < required 0.6500."
              )

          previous = os.environ.get("PREVIOUS_F1", "").strip()
          if previous:
              previous_f1 = float(previous)
              if new_f1 < previous_f1:
                  raise SystemExit(
                      f"FAILED: candidate F1 {new_f1:.4f} is lower than "
                      f"production F1 {previous_f1:.4f}; deployment cancelled."
                  )
              print(
                  f"PASSED: candidate F1 {new_f1:.4f} >= "
                  f"production F1 {previous_f1:.4f}."
              )
          else:
              print(f"PASSED first deployment with F1 {new_f1:.4f}.")
          PYEOF

  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Promote the accepted candidate to current, restart the VM service, and
  # retry the health check so short application startup time is tolerated.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: [train, quality-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 363.0.0'

      - name: Promote candidate to production
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          set -euo pipefail
          CANDIDATE_URI="gs://${ARTIFACT_BUCKET}/artifacts/candidates/${GITHUB_SHA}"
          CURRENT_URI="gs://${ARTIFACT_BUCKET}/artifacts/current"
          gcloud storage cp "${CANDIDATE_URI}/model.joblib" "${CURRENT_URI}/model.joblib"
          gcloud storage cp "${CANDIDATE_URI}/detail.txt" "${CURRENT_URI}/detail.txt"
          gcloud storage cp "${CANDIDATE_URI}/report.json" "${CURRENT_URI}/report.json"

      - name: Restart API and verify health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -e
            sudo systemctl restart income-api
            for attempt in $(seq 1 12); do
              if curl -fsS http://localhost:8080/healthz; then
                echo
                echo "Health check passed on attempt ${attempt}."
                exit 0
              fi
              echo "Waiting for income-api (${attempt}/12)..."
              sleep 5
            done
            sudo systemctl status income-api --no-pager || true
            sudo journalctl -u income-api -n 50 --no-pager || true
            echo "Health check failed."
            exit 1
